<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Docente - Sistema de Asistencias</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

<div class="login-pagina">
    <div class="login-tarjeta">

        <h1 class="login-titulo">Registro de Docente</h1>
        <p class="login-subtitulo">Crea tu cuenta para gestionar tus materias y grupos</p>

        {% if error %}
        <div class="alerta-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/registro/docente">

            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                    value="{{ datos.nombre or '' }}"
                    placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="campo">
                <label for="titulo">Título académico</label>
                <select id="titulo" name="titulo" required>
                    <option value="" disabled {% if not datos.titulo %}selected{% endif %}>Selecciona tu título</option>
                    <option value="Lic." {% if datos.titulo == 'Lic.' %}selected{% endif %}>Lic. — Licenciado</option>
                    <option value="Ing." {% if datos.titulo == 'Ing.' %}selected{% endif %}>Ing. — Ingeniero</option>
                    <option value="Arq." {% if datos.titulo == 'Arq.' %}selected{% endif %}>Arq. — Arquitecto</option>
                    <option value="Mgtr." {% if datos.titulo == 'Mgtr.' %}selected{% endif %}>Mgtr. — Magíster</option>
                    <option value="Dr." {% if datos.titulo == 'Dr.' %}selected{% endif %}>Dr. — Doctor</option>
                </select>
            </div>

            <div class="campo">
                <label for="profesion">Profesión</label>
                <input type="text" id="profesion" name="profesion"
                    value="{{ datos.profesion or '' }}"
                    placeholder="Ej. Ingeniería en Sistemas" required>
            </div>

            <div class="campo">
                <label for="departamento">Departamento</label>
                <input type="text" id="departamento" name="departamento"
                    value="{{ datos.departamento or '' }}"
                    placeholder="Ej. Ciencias de la Computación" required>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono de contacto <span class="campo-opcional">(opcional)</span></label>
                <input type="tel" id="telefono" name="telefono"
                    value="{{ datos.telefono or '' }}"
                    placeholder="Ej. +503 7000-0000">
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email"
                    value="{{ datos.email or '' }}"
                    placeholder="correo@ejemplo.com" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                    placeholder="Mínimo 8 caracteres" required minlength="8">
            </div>

            <button type="submit" class="btn-login">Crear cuenta</button>

        </form>

        <div class="login-pie">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
        </div>

    </div>
</div>

</body>
</html>
