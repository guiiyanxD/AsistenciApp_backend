<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Sistema de Asistencias{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

    <nav class="nav">
        <span class="nav-titulo">Sistema de Asistencias</span>
        <div class="nav-derecha">
            <span class="nav-usuario">{{ nombre }}</span>
            <a href="/logout">Cerrar sesión</a>
        </div>
    </nav>

    <div class="contenedor">
        {% block contenido %}{% endblock %}
    </div>

</body>
</html>
