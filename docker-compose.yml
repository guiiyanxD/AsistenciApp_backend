version: "3.9"

services:
  db:
    image: postgres:16
    container_name: asistencia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: asistencia_db
      POSTGRES_USER: asistencia_user
      POSTGRES_PASSWORD: asistencia_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistencia_user -d asistencia_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_container
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ficct.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build: .
    container_name: asistencia_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: asistencia_db
      DB_USER: asistencia_user
      DB_PASSWORD: asistencia_pass
      JWT_SECRET: cambia_este_secreto_en_produccion
      JWT_EXPIRY_HOURS: 24
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
  pgadmin_data:
